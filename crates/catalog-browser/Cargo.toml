[package]
name = "catalog-browser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browse the catalog with kicad-cli previews; the use cases behind the desktop shell, without Tauri."

[dependencies]
base64 = "0.22"
catalog = { path = "../catalog" }
collaboration = { path = "../collaboration" }
csv-catalog = { path = "../csv-catalog" }
desktop-contract = { path = "../desktop-contract" }
kicad-integration = { path = "../kicad-integration" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.10"
