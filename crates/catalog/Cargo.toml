[package]
name = "catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Catalog context: parts, part revisions, CAD items and Changes, the deterministic CSV catalog import, and the PocketBase contract that stores them. No Tauri."

[dependencies]
base64 = "0.22"
collaboration = { path = "../collaboration" }
csv = "1.3"
kicad-integration = { path = "../kicad-integration" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# Reads downloaded ZIP files in memory (kicad-parts-9693). Deflate through
# flate2 only, as in native-services, so the lock file gains no new crate;
# flate2 is named for its default (pure Rust) backend.
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
tempfile = "3.10"
