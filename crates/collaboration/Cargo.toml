[package]
name = "collaboration"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Client and contract for the PocketBase team backend: protected revisioned commands, realtime change notifications and checkpoint reconciliation. No Tauri."

[dependencies]
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", default-features = false }

[dev-dependencies]
native-services = { path = "../../tooling/native-services" }
tempfile = "3.10"
