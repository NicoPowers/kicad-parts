[workspace]
members = [
    "apps/desktop",
    "apps/desktop-ui",
    "crates/catalog",
    "crates/catalog-browser",
    "crates/collaboration",
    "crates/csv-catalog",
    "crates/desktop-contract",
    "crates/kicad-integration",
    "crates/kicad-libraries",
    "tooling/afk",
    "tooling/catalog-import",
    "tooling/fake-kicad-cli",
    "tooling/journey-desktop",
    "tooling/native-services",
    "tooling/sample-library",
    "tooling/xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

# Hashing preview libraries in debug builds would otherwise be slow.
[profile.dev.package.sha2]
opt-level = 3

# The Libraries browser reads KiCad's 430 MB of libraries in the background;
# the journeys run debug builds, so these stay fast there too.
[profile.dev.package.kicad-integration]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3
