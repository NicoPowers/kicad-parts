name: KiCad 10 Ubuntu X11 smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/kicad-gui-smoke.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "infra/versions.lock"
      - "rust-toolchain.toml"
      - "tooling/afk/**"
      - "tooling/xtask/**"
      - "fixtures/kicad-10/**"

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUST_VERSION: "1.85.1"
      NODE_VERSION: "24.18.0"
      NPM_VERSION: "11.16.0"
      NODE_URL: "https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz"
      NODE_SHA256: "55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742"
      TAURI_VERSION: "2.11.4"
      TAURI_URL: "https://registry.npmjs.org/@tauri-apps/cli/-/cli-2.11.4.tgz"
      TAURI_SHA512: "47cc46b4ca70c9eb5ac12aa6f6460eb8c984aa48546ef714cbc9f468d5c8c689652812c4494bb97f8171fbae218004989b51fe8d25aaea3096eb3a939c7ea1a9"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Load exact Ubuntu GUI package contract from versions.lock
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo xtask export-github-env >> "$GITHUB_ENV"

      - name: Install exact KiCad and pinned Tauri/X11/Openbox runner
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes "$KICAD_PPA"
          sudo apt-get update
          apt-cache madison "$KICAD_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$KICAD_VERSION"
          apt-cache madison "$KICAD_SYMBOLS_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$KICAD_SYMBOLS_VERSION"
          apt-cache madison "$KICAD_FOOTPRINTS_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$KICAD_FOOTPRINTS_VERSION"
          apt-cache madison "$KICAD_PACKAGES3D_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$KICAD_PACKAGES3D_VERSION"
          apt-cache madison "$WEBKIT_LIBRARY_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$WEBKIT_LIBRARY_VERSION"
          apt-cache madison "$WEBKIT_DRIVER_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$WEBKIT_DRIVER_VERSION"
          apt-cache madison "$XVFB_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$XVFB_VERSION"
          apt-cache madison "$X11_UTILS_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$X11_UTILS_VERSION"
          apt-cache madison "$IMAGEMAGICK_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$IMAGEMAGICK_VERSION"
          apt-cache madison "$WINDOW_MANAGER_PACKAGE" | awk '{print $3}' | grep -Fqx -- "$WINDOW_MANAGER_VERSION"
          sudo apt-get install --yes --allow-downgrades \
            "$KICAD_SPEC" "$KICAD_SYMBOLS_SPEC" "$KICAD_FOOTPRINTS_SPEC" \
            "$KICAD_PACKAGES3D_SPEC" "$WEBKIT_LIBRARY_SPEC" "$WEBKIT_DRIVER_SPEC" \
            "$XVFB_SPEC" "$X11_UTILS_SPEC" "$IMAGEMAGICK_SPEC"
          sudo apt-get install --yes --no-install-recommends --allow-downgrades \
            "$WINDOW_MANAGER_SPEC"
          test "$(dpkg-query -W -f='${Version}' "$KICAD_PACKAGE")" = "$KICAD_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$KICAD_SYMBOLS_PACKAGE")" = "$KICAD_SYMBOLS_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$KICAD_FOOTPRINTS_PACKAGE")" = "$KICAD_FOOTPRINTS_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$KICAD_PACKAGES3D_PACKAGE")" = "$KICAD_PACKAGES3D_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$WEBKIT_LIBRARY_PACKAGE")" = "$WEBKIT_LIBRARY_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$WEBKIT_DRIVER_PACKAGE")" = "$WEBKIT_DRIVER_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$XVFB_PACKAGE")" = "$XVFB_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$X11_UTILS_PACKAGE")" = "$X11_UTILS_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$IMAGEMAGICK_PACKAGE")" = "$IMAGEMAGICK_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$WINDOW_MANAGER_PACKAGE")" = "$WINDOW_MANAGER_VERSION"
          test "$(command -v kicad-cli)" = /usr/bin/kicad-cli
          test "$(command -v kicad)" = /usr/bin/kicad
          test "$(command -v Xvfb)" = /usr/bin/Xvfb
          test "$(command -v xwininfo)" = /usr/bin/xwininfo
          test "$(command -v import)" = /usr/bin/import
          test "$(command -v identify)" = /usr/bin/identify
          test "$(command -v openbox)" = /usr/bin/openbox
          test "$(command -v xprop)" = /usr/bin/xprop
          rustup default "$RUST_VERSION"
          curl --fail --location --silent --show-error "$NODE_URL" --output /tmp/node.tar.xz
          echo "$NODE_SHA256  /tmp/node.tar.xz" | sha256sum -c -
          toolchain_prefix="$RUNNER_TEMP/kicad-gui-toolchain-$NODE_VERSION-$TAURI_VERSION"
          test ! -e "$toolchain_prefix"
          mkdir "$toolchain_prefix"
          tar -xJf /tmp/node.tar.xz --strip-components=1 -C "$toolchain_prefix"
          export PATH="$toolchain_prefix/bin:$PATH"
          curl --fail --location --silent --show-error "$TAURI_URL" --output /tmp/tauri-cli.tgz
          echo "$TAURI_SHA512  /tmp/tauri-cli.tgz" | sha512sum -c -
          curl --fail --location --silent --show-error "$TAURI_LINUX_X64_GNU_URL" --output /tmp/tauri-cli-linux-x64-gnu.tgz
          echo "$TAURI_LINUX_X64_GNU_SHA512  /tmp/tauri-cli-linux-x64-gnu.tgz" | sha512sum -c -
          artifact_dir="$GITHUB_WORKSPACE/.afk/gui/artifacts"
          npm_logs="$artifact_dir/npm-logs"
          npm_home="$RUNNER_TEMP/kicad-gui-npm-home"
          mkdir -p "$npm_logs" "$npm_home"
          env HOME="$npm_home" NPM_CONFIG_USERCONFIG=/dev/null "$toolchain_prefix/bin/npm" install \
            --global --prefix "$toolchain_prefix" --offline --omit=optional --ignore-scripts \
            --loglevel verbose --logs-dir "$npm_logs" --audit=false --fund=false \
            --update-notifier=false /tmp/tauri-cli.tgz /tmp/tauri-cli-linux-x64-gnu.tgz \
            2>&1 | tee "$artifact_dir/npm-tauri-install.log"
          echo "$toolchain_prefix/bin" >> "$GITHUB_PATH"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"
          test "$("$toolchain_prefix/bin/node" --version)" = "v$NODE_VERSION"
          test "$("$toolchain_prefix/bin/npm" --version)" = "$NPM_VERSION"
          test "$("$toolchain_prefix/bin/tauri" --version)" = "tauri-cli $TAURI_VERSION"

      - name: Launch isolated KiCad GUI smoke and write lane evidence
        shell: bash
        env:
          HOME: ${{ github.workspace }}/.afk/gui/home
          XDG_CACHE_HOME: ${{ github.workspace }}/.afk/gui/xdg/cache
          XDG_CONFIG_HOME: ${{ github.workspace }}/.afk/gui/xdg/config
          XDG_DATA_HOME: ${{ github.workspace }}/.afk/gui/xdg/data
          XDG_STATE_HOME: ${{ github.workspace }}/.afk/gui/xdg/state
          KICAD_CONFIG_HOME: ${{ github.workspace }}/.afk/gui/kicad/config
          DISPLAY: ":99"
        run: |
          set -euo pipefail
          artifact_dir=.afk/gui/artifacts
          fixture=fixtures/kicad-10/afk-smoke/afk-smoke.kicad_pcb
          startup_config_source=fixtures/kicad-10/gui-config
          startup_config_manifest="$startup_config_source/SHA256SUMS"
          startup_config_dir="$KICAD_CONFIG_HOME/10.0"
          startup_config_files=(kicad_common.json sym-lib-table fp-lib-table design-block-lib-table)
          stock_symbol_table=/usr/share/kicad/template/sym-lib-table
          stock_footprint_table=/usr/share/kicad/template/fp-lib-table
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$KICAD_CONFIG_HOME" "$artifact_dir"
          xvfb_pid=
          wm_pid=
          kicad_pid=
          capture_kicad_process_snapshot() {
            local snapshot_attempt=$1
            local snapshot_file="$artifact_dir/kicad-process-snapshot-attempt-$snapshot_attempt.txt"
            {
              printf 'attempt=%s pid=%s\n' "$snapshot_attempt" "$kicad_pid"
              if [[ ! -d "/proc/$kicad_pid" ]]; then
                printf 'process unavailable before snapshot\n'
                return 0
              fi
              printf 'executable='
              readlink "/proc/$kicad_pid/exe" || true
              sha256sum "/proc/$kicad_pid/exe" || true
              printf 'command_line='
              tr '\0' ' ' < "/proc/$kicad_pid/cmdline" || true
              printf '\n--- process status ---\n'
              cat "/proc/$kicad_pid/status" || true
              printf '%s\n' '--- thread summary ---'
              ps -L -p "$kicad_pid" -o pid=,tid=,psr=,stat=,wchan:32=,etime=,comm=,args= || true
              for task_dir in "/proc/$kicad_pid"/task/[0-9]*; do
                [[ -d "$task_dir" ]] || continue
                task_id=${task_dir##*/}
                printf -- '--- thread=%s comm ---\n' "$task_id"
                cat "$task_dir/comm" || true
                printf -- '--- thread=%s wchan ---\n' "$task_id"
                cat "$task_dir/wchan" || true
                printf -- '--- thread=%s status ---\n' "$task_id"
                grep -E '^(Name|State|Tgid|Pid|PPid|TracerPid|Threads):' "$task_dir/status" || true
                printf -- '--- thread=%s syscall ---\n' "$task_id"
                cat "$task_dir/syscall" || true
              done
            } > "$snapshot_file" 2>&1 || true
          }
          finish() {
            rc=$?
            trap - EXIT
            if [[ -n "$kicad_pid" ]]; then kill "$kicad_pid" 2>/dev/null || true; wait "$kicad_pid" 2>/dev/null || true; fi
            if [[ -n "$wm_pid" ]]; then kill "$wm_pid" 2>/dev/null || true; wait "$wm_pid" 2>/dev/null || true; fi
            if [[ -n "$xvfb_pid" ]]; then kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true; fi
            if [[ -n "${startup_config_dir:-}" && -d "$startup_config_dir" ]]; then
              (
                cd "$startup_config_dir"
                sha256sum "${startup_config_files[@]}"
              ) > "$artifact_dir/startup-config-post-run.sha256" 2>> "$artifact_dir/startup-config-readiness.txt" || true
              if [[ -f "$startup_config_dir/kicad_common.json" && ! -L "$startup_config_dir/kicad_common.json" ]]; then
                cp -- "$startup_config_dir/kicad_common.json" "$artifact_dir/startup-config-post-run-kicad_common.json" 2>> "$artifact_dir/startup-config-readiness.txt" || true
              fi
            fi
            if [[ $rc -eq 0 ]]; then status=passed; failures=0; failure_xml=; else status=failed; failures=1; failure_xml='<failure message="Ubuntu X11 GUI smoke failed; inspect uploaded logs"/>'; fi
            printf '{"schema":1,"lane":"ubuntu-x11-gui","status":"%s","exit_code":%d,"kicad_package":"%s","window_asserted":%s,"fixture_unchanged":%s,"gui_input":"blank","gui_board_opened":false,"fixture_evidence":"integrity_only","file_integration_lane":"afk-linux-cli-drc"}\n' \
              "$status" "$rc" "$KICAD_VERSION" "${window_asserted:-false}" "${fixture_unchanged:-false}" > "$artifact_dir/lane-result.json"
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<testsuite name="ubuntu-x11-gui" tests="1" failures="%d"><testcase name="kicad-10-window-smoke">%s</testcase></testsuite>\n' \
              "$failures" "$failure_xml" > "$artifact_dir/results.xml"
            exit "$rc"
          }
          trap finish EXIT
          sha256sum "$fixture" > "$artifact_dir/source.before.sha256"
          {
            printf 'startup_config_source=%s\n' "$startup_config_source"
            printf 'startup_config_dir=%s\n' "$startup_config_dir"
            printf 'startup_config_files=%s\n' "${startup_config_files[*]}"
            test "$startup_config_dir" = "$GITHUB_WORKSPACE/.afk/gui/kicad/config/10.0"
            test -f "$startup_config_manifest"
            test -f "$stock_symbol_table"
            test -f "$stock_footprint_table"
            (
              cd "$startup_config_source"
              sha256sum "${startup_config_files[@]}" > "$GITHUB_WORKSPACE/$artifact_dir/startup-config-source.sha256"
              sha256sum -c SHA256SUMS
            )
            cmp "$startup_config_manifest" "$artifact_dir/startup-config-source.sha256"
            chmod a-w "$startup_config_manifest"
            test ! -w "$startup_config_manifest"
            for startup_config_file in "${startup_config_files[@]}"; do
              chmod a-w "$startup_config_source/$startup_config_file"
              test ! -w "$startup_config_source/$startup_config_file"
            done
            chmod a-w "$startup_config_source"
            test ! -w "$startup_config_source"
            test ! -e "$startup_config_dir"
            mkdir "$startup_config_dir"
            for startup_config_file in "${startup_config_files[@]}"; do
              cp "$startup_config_source/$startup_config_file" "$startup_config_dir/$startup_config_file"
              chmod u+w "$startup_config_dir/$startup_config_file"
              cmp "$startup_config_source/$startup_config_file" "$startup_config_dir/$startup_config_file"
            done
            (
              cd "$startup_config_dir"
              sha256sum "${startup_config_files[@]}" > "$GITHUB_WORKSPACE/$artifact_dir/startup-config-copy.sha256"
              sha256sum -c "$GITHUB_WORKSPACE/$startup_config_manifest"
            )
            cmp "$startup_config_manifest" "$artifact_dir/startup-config-copy.sha256"
            printf 'KiCad 10 first-run config ready; source is read-only and run-scoped copy is writable\n'
          } > "$artifact_dir/startup-config-readiness.txt" 2>&1
          {
            uname -a
            dpkg-query -W "$KICAD_PACKAGE" "$KICAD_SYMBOLS_PACKAGE" "$KICAD_FOOTPRINTS_PACKAGE" "$KICAD_PACKAGES3D_PACKAGE" "$WEBKIT_LIBRARY_PACKAGE" "$WEBKIT_DRIVER_PACKAGE" "$XVFB_PACKAGE" "$X11_UTILS_PACKAGE" "$IMAGEMAGICK_PACKAGE" "$WINDOW_MANAGER_PACKAGE"
            rustc --version
            cargo --version
            node --version
            npm --version
            tauri --version
          } > "$artifact_dir/machine-manifest.txt"
          test "$(dpkg-query -W -f='${Version}' "$KICAD_PACKAGE")" = "$KICAD_VERSION"
          test "$(dpkg-query -W -f='${Version}' "$WINDOW_MANAGER_PACKAGE")" = "$WINDOW_MANAGER_VERSION"
          kicad_upstream_version="${KICAD_VERSION%%~*}"
          test -f "$STOCK_SYMBOL"
          test -f "$STOCK_FOOTPRINT"
          test -f "$STOCK_3D_MODEL"
          kicad-cli version --format about | tee "$artifact_dir/kicad-version.txt"
          grep -Fqx -- "Version: $kicad_upstream_version-$KICAD_VERSION, release build" "$artifact_dir/kicad-version.txt"
          {
            printf 'command_path='
            command -v kicad
            printf 'resolved_path='
            readlink -f /usr/bin/kicad
            stat --format='path=%n mode=%a size=%s owner=%u:%g' /usr/bin/kicad /usr/bin/_pcbnew.kiface
            sha256sum /usr/bin/kicad /usr/bin/_pcbnew.kiface
            ldd /usr/bin/kicad
          } > "$artifact_dir/kicad-launcher-identity.txt" 2>&1
          {
            printf 'core_soft_limit_blocks='
            ulimit -S -c
            printf 'core_hard_limit_blocks='
            ulimit -H -c
            printf 'core_pattern='
            cat /proc/sys/kernel/core_pattern
            printf 'core_uses_pid='
            cat /proc/sys/kernel/core_uses_pid
            for diagnostic_path in /usr/bin/gdb /usr/bin/coredumpctl /usr/bin/eu-stack /usr/bin/catchsegv; do
              if [[ -e "$diagnostic_path" ]]; then
                stat --format='diagnostic_path=%n mode=%a size=%s owner=%u:%g' "$diagnostic_path"
                dpkg-query -S "$diagnostic_path" || true
              else
                printf 'diagnostic_path=%s absent\n' "$diagnostic_path"
              fi
            done
            dpkg-query -W -f='package=${binary:Package} version=${Version}\n' gdb systemd systemd-coredump elfutils libc-bin 2>&1 || true
          } > "$artifact_dir/debugger-core-capabilities.txt" 2>&1
          xserver_current="$RUNNER_TEMP/kicad-xserver-readiness.current.txt"
          wm_root_current="$RUNNER_TEMP/kicad-wm-root.current.txt"
          wm_window_current="$RUNNER_TEMP/kicad-wm-window.current.txt"
          : > "$artifact_dir/xserver-readiness.txt"
          : > "$artifact_dir/wm-readiness.txt"
          Xvfb :99 -screen 0 1280x800x24 > "$artifact_dir/xvfb.log" 2>&1 &
          xvfb_pid=$!
          for _xserver_attempt in $(seq 1 100); do
            printf -- '--- xserver attempt=%d ---\n' "$_xserver_attempt" >> "$artifact_dir/xserver-readiness.txt"
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              if wait "$xvfb_pid"; then xvfb_rc=0; else xvfb_rc=$?; fi
              xvfb_pid=
              printf 'Xvfb exited before readiness (exit_code=%d)\n' "$xvfb_rc" >> "$artifact_dir/xvfb.log"
              break
            fi
            if xprop -root -notype > "$xserver_current" 2>&1; then
              cat "$xserver_current" >> "$artifact_dir/xserver-readiness.txt"
              xserver_ready=true
              break
            else
              cat "$xserver_current" >> "$artifact_dir/xserver-readiness.txt"
            fi
            sleep 0.1
          done
          test "${xserver_ready:-false}" = true
          /usr/bin/openbox --sm-disable > "$artifact_dir/wm.log" 2>&1 &
          wm_pid=$!
          for _wm_attempt in $(seq 1 100); do
            printf -- '--- wm attempt=%d ---\n' "$_wm_attempt" >> "$artifact_dir/wm-readiness.txt"
            if ! kill -0 "$wm_pid" 2>/dev/null; then
              if wait "$wm_pid"; then wm_rc=0; else wm_rc=$?; fi
              wm_pid=
              printf 'Openbox exited before readiness (exit_code=%d)\n' "$wm_rc" >> "$artifact_dir/wm.log"
              break
            fi
            if xprop -root -notype _NET_SUPPORTING_WM_CHECK > "$wm_root_current" 2>&1; then
              cat "$wm_root_current" >> "$artifact_dir/wm-readiness.txt"
              if wm_window_id=$(awk '$1 == "_NET_SUPPORTING_WM_CHECK:" && $2 == "window" && $3 == "id" && $4 == "#" && $5 ~ /^0x[[:xdigit:]]+$/ && NF == 5 { count++; id=$5 } END { if (count == 1) print id; else exit 1 }' "$wm_root_current"); then
                if xprop -id "$wm_window_id" -notype _NET_SUPPORTING_WM_CHECK _NET_WM_NAME > "$wm_window_current" 2>&1; then
                  cat "$wm_window_current" >> "$artifact_dir/wm-readiness.txt"
                  if awk -v expected_id="$wm_window_id" '$1 == "_NET_SUPPORTING_WM_CHECK:" && $2 == "window" && $3 == "id" && $4 == "#" && $5 == expected_id && NF == 5 { self_count++ } $1 == "_NET_WM_NAME" && $2 == "=" && $3 == "\"Openbox\"" && NF == 3 { name_count++ } END { exit(self_count == 1 && name_count == 1 ? 0 : 1) }' "$wm_window_current"; then
                    printf 'Openbox readiness accepted: root_owner=%s self_owner=%s name=Openbox\n' "$wm_window_id" "$wm_window_id" >> "$artifact_dir/wm-readiness.txt"
                    wm_ready=true
                    break
                  fi
                else
                  cat "$wm_window_current" >> "$artifact_dir/wm-readiness.txt"
                fi
              fi
            else
              cat "$wm_root_current" >> "$artifact_dir/wm-readiness.txt"
            fi
            sleep 0.1
          done
          : > "$artifact_dir/kicad-process-status.txt"
          test "${wm_ready:-false}" = true
          kill -0 "$wm_pid" 2>/dev/null
          /usr/bin/kicad --frame pcb --software-rendering > "$artifact_dir/kicad-gui.log" 2>&1 &
          kicad_pid=$!
          current_tree="$RUNNER_TEMP/kicad-window-tree.current.txt"
          current_detail="$RUNNER_TEMP/kicad-window-detail.current.txt"
          candidate_file="$RUNNER_TEMP/kicad-window-candidates.current.txt"
          qualified_file="$RUNNER_TEMP/kicad-window-qualified.current.txt"
          post_tree="$RUNNER_TEMP/kicad-window-tree.post-capture.txt"
          post_detail="$RUNNER_TEMP/kicad-window-detail.post-capture.txt"
          post_candidate_file="$RUNNER_TEMP/kicad-window-candidates.post-capture.txt"
          post_qualified_file="$RUNNER_TEMP/kicad-window-qualified.post-capture.txt"
          min_window_width=100
          min_window_height=100
          window_id=
          window_width=
          window_height=
          : > "$artifact_dir/window-tree.txt"
          : > "$artifact_dir/window-details.txt"
          for _attempt in $(seq 1 180); do
            printf -- '--- attempt=%d ---\n' "$_attempt" >> "$artifact_dir/kicad-process-status.txt"
            ps -o pid=,ppid=,stat=,etime=,args= -p "$kicad_pid" >> "$artifact_dir/kicad-process-status.txt" 2>&1 || true
            case "$_attempt" in
              1|30|60|120|180) capture_kicad_process_snapshot "$_attempt" ;;
            esac
            printf -- '--- attempt=%d ---\n' "$_attempt" >> "$artifact_dir/window-tree.txt"
            printf -- '--- attempt=%d candidates ---\n' "$_attempt" >> "$artifact_dir/window-details.txt"
            : > "$candidate_file"
            : > "$qualified_file"
            if xwininfo -root -tree > "$current_tree" 2>&1; then
              cat "$current_tree" >> "$artifact_dir/window-tree.txt"
              awk '$0 ~ /^[[:space:]]+0x[[:xdigit:]]+[[:space:]]+.*:[[:space:]]+\("kicad" "KiCad"\)[[:space:]]+[1-9][0-9]*x[1-9][0-9]*\+-?[0-9]+\+-?[0-9]+[[:space:]]+\+-?[0-9]+\+-?[0-9]+$/ { geometry=$(NF-1); split(geometry, dimensions, "x"); width=dimensions[1]+0; split(dimensions[2], height_and_position, /\+/); height=height_and_position[1]+0; print $1, width, height }' "$current_tree" > "$candidate_file"
              while read -r candidate_id tree_width tree_height; do
                printf -- 'candidate=%s tree_size=%sx%s minimum=%sx%s\n' "$candidate_id" "$tree_width" "$tree_height" "$min_window_width" "$min_window_height" >> "$artifact_dir/window-details.txt"
                if xwininfo -id "$candidate_id" > "$current_detail" 2>&1; then
                  cat "$current_detail" >> "$artifact_dir/window-details.txt"
                  if awk -v expected_id="$candidate_id" -v expected_width="$tree_width" -v expected_height="$tree_height" -v min_width="$min_window_width" -v min_height="$min_window_height" '$1 == "xwininfo:" && $2 == "Window" && $3 == "id:" && $4 == expected_id { id_count++ } $1 == "Width:" && NF == 2 && $2 ~ /^[0-9]+$/ { width_count++; width=$2+0 } $1 == "Height:" && NF == 2 && $2 ~ /^[0-9]+$/ { height_count++; height=$2+0 } $1 == "Map" && $2 == "State:" { map_count++; if (NF == 3 && $3 == "IsViewable") viewable_count++ } END { exit(id_count == 1 && width_count == 1 && height_count == 1 && map_count == 1 && viewable_count == 1 && width == expected_width && height == expected_height && width >= min_width && height >= min_height ? 0 : 1) }' "$current_detail"; then
                    printf '%s %s %s\n' "$candidate_id" "$tree_width" "$tree_height" >> "$qualified_file"
                    printf 'candidate qualified: id=%s size=%sx%s map_state=IsViewable\n' "$candidate_id" "$tree_width" "$tree_height" >> "$artifact_dir/window-details.txt"
                  else
                    printf 'candidate rejected: id=%s\n' "$candidate_id" >> "$artifact_dir/window-details.txt"
                  fi
                else
                  cat "$current_detail" >> "$artifact_dir/window-details.txt"
                  printf 'candidate query failed: id=%s\n' "$candidate_id" >> "$artifact_dir/window-details.txt"
                fi
              done < "$candidate_file"
            else
              cat "$current_tree" >> "$artifact_dir/window-tree.txt"
            fi
            qualified_count=$(awk 'END { print NR+0 }' "$qualified_file")
            printf 'qualified candidate count=%s\n' "$qualified_count" >> "$artifact_dir/window-details.txt"
            if [[ "$qualified_count" -eq 1 ]]; then
              read -r candidate_id tree_width tree_height < "$qualified_file"
              : > "$artifact_dir/kicad-gui.png"
              if import -window "$candidate_id" "$artifact_dir/kicad-gui.png" 2>> "$artifact_dir/window-details.txt"; then
                printf -- '--- attempt=%d post-capture tree candidate=%s ---\n' "$_attempt" "$candidate_id" >> "$artifact_dir/window-tree.txt"
                : > "$post_candidate_file"
                : > "$post_qualified_file"
                if xwininfo -root -tree > "$post_tree" 2>&1; then
                  cat "$post_tree" >> "$artifact_dir/window-tree.txt"
                  awk '$0 ~ /^[[:space:]]+0x[[:xdigit:]]+[[:space:]]+.*:[[:space:]]+\("kicad" "KiCad"\)[[:space:]]+[1-9][0-9]*x[1-9][0-9]*\+-?[0-9]+\+-?[0-9]+[[:space:]]+\+-?[0-9]+\+-?[0-9]+$/ { geometry=$(NF-1); split(geometry, dimensions, "x"); width=dimensions[1]+0; split(dimensions[2], height_and_position, /\+/); height=height_and_position[1]+0; print $1, width, height }' "$post_tree" > "$post_candidate_file"
                  while read -r post_candidate_id post_tree_width post_tree_height; do
                    printf -- 'post-capture candidate=%s tree_size=%sx%s minimum=%sx%s\n' "$post_candidate_id" "$post_tree_width" "$post_tree_height" "$min_window_width" "$min_window_height" >> "$artifact_dir/window-details.txt"
                    if xwininfo -id "$post_candidate_id" > "$post_detail" 2>&1; then
                      cat "$post_detail" >> "$artifact_dir/window-details.txt"
                      if awk -v expected_id="$post_candidate_id" -v expected_width="$post_tree_width" -v expected_height="$post_tree_height" -v min_width="$min_window_width" -v min_height="$min_window_height" '$1 == "xwininfo:" && $2 == "Window" && $3 == "id:" && $4 == expected_id { id_count++ } $1 == "Width:" && NF == 2 && $2 ~ /^[0-9]+$/ { width_count++; width=$2+0 } $1 == "Height:" && NF == 2 && $2 ~ /^[0-9]+$/ { height_count++; height=$2+0 } $1 == "Map" && $2 == "State:" { map_count++; if (NF == 3 && $3 == "IsViewable") viewable_count++ } END { exit(id_count == 1 && width_count == 1 && height_count == 1 && map_count == 1 && viewable_count == 1 && width == expected_width && height == expected_height && width >= min_width && height >= min_height ? 0 : 1) }' "$post_detail"; then
                        printf '%s %s %s\n' "$post_candidate_id" "$post_tree_width" "$post_tree_height" >> "$post_qualified_file"
                        printf 'post-capture candidate qualified: id=%s size=%sx%s map_state=IsViewable\n' "$post_candidate_id" "$post_tree_width" "$post_tree_height" >> "$artifact_dir/window-details.txt"
                      else
                        printf 'post-capture candidate rejected: id=%s\n' "$post_candidate_id" >> "$artifact_dir/window-details.txt"
                      fi
                    else
                      cat "$post_detail" >> "$artifact_dir/window-details.txt"
                      printf 'post-capture candidate query failed: id=%s\n' "$post_candidate_id" >> "$artifact_dir/window-details.txt"
                    fi
                  done < "$post_candidate_file"
                else
                  cat "$post_tree" >> "$artifact_dir/window-tree.txt"
                fi
                post_qualified_count=$(awk 'END { print NR+0 }' "$post_qualified_file")
                printf 'post-capture qualified candidate count=%s\n' "$post_qualified_count" >> "$artifact_dir/window-details.txt"
                if [[ "$post_qualified_count" -eq 1 ]]; then
                  read -r post_candidate_id post_tree_width post_tree_height < "$post_qualified_file"
                  if [[ "$post_candidate_id" == "$candidate_id" && "$post_tree_width" -eq "$tree_width" && "$post_tree_height" -eq "$tree_height" ]]; then
                    if identify -format '%w %h %k\n' "$artifact_dir/kicad-gui.png" > "$artifact_dir/kicad-gui.identify.txt" 2>&1; then
                      cat "$artifact_dir/kicad-gui.identify.txt" >> "$artifact_dir/window-details.txt"
                      read -r image_width image_height image_colors < "$artifact_dir/kicad-gui.identify.txt"
                      if [[ "$image_width" =~ ^[1-9][0-9]*$ && "$image_height" =~ ^[1-9][0-9]*$ && "$image_colors" =~ ^[1-9][0-9]*$ ]] && (( image_width == tree_width && image_height == tree_height && image_colors > 1 )); then
                        window_id=$candidate_id
                        window_width=$tree_width
                        window_height=$tree_height
                        printf 'candidate accepted after global post-capture revalidation: id=%s size=%sx%s colors=%s map_state=IsViewable\n' "$window_id" "$window_width" "$window_height" "$image_colors" >> "$artifact_dir/window-details.txt"
                      fi
                    fi
                  else
                    printf 'post-capture sole candidate changed: pre=%s/%sx%s post=%s/%sx%s\n' "$candidate_id" "$tree_width" "$tree_height" "$post_candidate_id" "$post_tree_width" "$post_tree_height" >> "$artifact_dir/window-details.txt"
                  fi
                elif [[ "$post_qualified_count" -eq 0 ]]; then
                  printf 'no post-capture qualified candidate on attempt=%s\n' "$_attempt" >> "$artifact_dir/window-details.txt"
                else
                  printf 'ambiguous post-capture qualified candidates on attempt=%s count=%s\n' "$_attempt" "$post_qualified_count" >> "$artifact_dir/window-details.txt"
                fi
              fi
            elif [[ "$qualified_count" -eq 0 ]]; then
              printf 'no qualified candidate on attempt=%s\n' "$_attempt" >> "$artifact_dir/window-details.txt"
            else
              printf 'ambiguous qualified candidates on attempt=%s count=%s\n' "$_attempt" "$qualified_count" >> "$artifact_dir/window-details.txt"
            fi
            if [[ -n "$window_id" ]]; then
              window_asserted=true
              break
            fi
            if ! kill -0 "$wm_pid" 2>/dev/null; then
              if wait "$wm_pid"; then wm_rc=0; else wm_rc=$?; fi
              wm_pid=
              printf 'Openbox exited before window assertion (exit_code=%d)\n' "$wm_rc" >> "$artifact_dir/wm.log"
              break
            fi
            if ! kill -0 "$kicad_pid" 2>/dev/null; then
              if wait "$kicad_pid"; then kicad_rc=0; else kicad_rc=$?; fi
              kicad_pid=
              printf 'KiCad PCB dispatcher exited before window assertion (exit_code=%d)\n' "$kicad_rc" >> "$artifact_dir/kicad-gui.log"
              break
            fi
            sleep 1
          done
          test "${window_asserted:-false}" = true
          sha256sum -c "$artifact_dir/source.before.sha256"
          sha256sum "$fixture" > "$artifact_dir/source.after.sha256"
          cmp "$artifact_dir/source.before.sha256" "$artifact_dir/source.after.sha256"
          fixture_unchanged=true

      - name: Ensure machine-readable failure evidence exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir=.afk/gui/artifacts
          mkdir -p "$artifact_dir"
          if [[ ! -f "$artifact_dir/lane-result.json" ]]; then
            printf '{"schema":1,"lane":"ubuntu-x11-gui","status":"failed","exit_code":1,"kicad_package":"%s","window_asserted":false,"fixture_unchanged":false,"gui_input":"blank","gui_board_opened":false,"fixture_evidence":"integrity_only","file_integration_lane":"afk-linux-cli-drc"}\n' \
              "${KICAD_VERSION:-unavailable}" > "$artifact_dir/lane-result.json"
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><testsuite name="ubuntu-x11-gui" tests="1" failures="1"><testcase name="kicad-10-window-smoke"><failure message="setup or smoke failed before lane evidence completed"/></testcase></testsuite>' \
              > "$artifact_dir/results.xml"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kicad-10-ubuntu-x11-smoke
          path: .afk/gui/artifacts
          if-no-files-found: error
