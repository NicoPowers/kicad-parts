[package]
name = "kicad-parts-desktop-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Leptos (client-side) UI for the KiCad Parts desktop app."

[dependencies]
console_error_panic_hook = "0.1"
desktop-contract = { path = "../../crates/desktop-contract" }
js-sys = "0.3"
# Leptos 0.8.4+ needs Rust 1.88; its server_fn macro crates publish no
# rust-version, so they are pinned here as well (see mulch).
leptos = { version = "=0.8.3", features = ["csr"] }
server_fn_macro = "=0.8.3"
server_fn_macro_default = "=0.8.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
