[package]
name = "local-team"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Starts disposable team servers seeded from the sample library, for trying the desktop app and for tests, and writes a team's KiCad libraries without the app."

[dependencies]
catalog = { path = "../../crates/catalog" }
collaboration = { path = "../../crates/collaboration" }
kicad-libraries = { path = "../../crates/kicad-libraries" }
native-services = { path = "../native-services" }
sample-library = { path = "../sample-library" }
serde_json = "1.0"

[dev-dependencies]
base64 = "0.22"
# The sign-in tests read in small pages (tests/pocketbase_sign_in.rs).
catalog = { path = "../../crates/catalog", features = ["test-support"] }
catalog-browser = { path = "../../crates/catalog-browser" }
desktop-contract = { path = "../../crates/desktop-contract" }
kicad-integration = { path = "../../crates/kicad-integration" }
# Reads the generated KiCad database library, and changes a stopped team
# server's data.db to test what it refuses.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.10"
# Builds small downloads for Add part from the sample library's files.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[target.'cfg(windows)'.dependencies]
# Ctrl+C handling for `local-team server`.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
