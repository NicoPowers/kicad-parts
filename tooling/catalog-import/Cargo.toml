[package]
name = "catalog-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Imports a Legacy Catalog grouping into a disposable PocketBase and proves it lossless field by field against the legacy import oracle."

[dependencies]
catalog = { path = "../../crates/catalog" }
collaboration = { path = "../../crates/collaboration" }
legacy-import-fixture = { path = "../import-fixture" }
native-services = { path = "../native-services" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
