[package]
name = "catalog-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Imports one CSV catalog file into a disposable PocketBase and proves it lossless field by field against the CSV catalog fixture."

[dependencies]
catalog = { path = "../../crates/catalog" }
collaboration = { path = "../../crates/collaboration" }
csv-catalog-fixture = { path = "../csv-catalog-fixture" }
kicad-integration = { path = "../../crates/kicad-integration" }
kicad-libraries = { path = "../../crates/kicad-libraries" }
native-services = { path = "../native-services" }
# Reads the generated KiCad database library to compare it with parts.sqlite.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"

[dev-dependencies]
base64 = "0.22"
# The sign-in tests read in small pages (tests/pocketbase_sign_in.rs).
catalog = { path = "../../crates/catalog", features = ["test-support"] }
catalog-browser = { path = "../../crates/catalog-browser" }
desktop-contract = { path = "../../crates/desktop-contract" }
# Builds small downloads for Add part from the repository's CAD files.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[target.'cfg(windows)'.dependencies]
# Ctrl+C handling for `local-team-server`.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
