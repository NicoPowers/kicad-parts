[package]
name = "catalog-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Imports one CSV catalog file into a disposable PocketBase and proves it lossless field by field against the legacy import oracle."

[dependencies]
catalog = { path = "../../crates/catalog" }
collaboration = { path = "../../crates/collaboration" }
kicad-integration = { path = "../../crates/kicad-integration" }
legacy-import-fixture = { path = "../import-fixture" }
native-services = { path = "../native-services" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"

[dev-dependencies]
catalog-browser = { path = "../../crates/catalog-browser" }
desktop-contract = { path = "../../crates/desktop-contract" }
# Inspects a rolled-back data.db while PocketBase is stopped.
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# Ctrl+C handling for `local-team-server`.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
